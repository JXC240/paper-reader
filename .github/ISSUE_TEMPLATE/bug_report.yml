name: Bug report / 问题反馈
description: Report a reproducible reader, setup, or export problem / 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: |
        Please try the bundled demo first. Do not attach personal papers, annotations, backups, local paths, or tokens. For sensitive findings, read SECURITY.md.
        请先尝试自带示例。不要上传私人论文、阅读记录、备份、个人路径或令牌；敏感问题请看 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: v0.4.0 or a commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 运行环境
      description: Operating system, browser, Python version, and launch method / 系统、浏览器、Python 版本及启动方式
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 重现步骤
      description: Include what happened and what you expected; say whether the bundled demo reproduces it. / 写明实际与预期行为，以及自带示例是否也出现问题。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence / 去除私人信息的证据
      description: Optional error text or screenshots of the bundled demo only. / 可选：报错文字或仅包含自带示例的截图。
